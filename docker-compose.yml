services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reddit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reddit}
      POSTGRES_DB: ${POSTGRES_DB:-reddit}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reddit} -d ${POSTGRES_DB:-reddit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-reddit}:${POSTGRES_PASSWORD:-reddit}@postgres:5432/${POSTGRES_DB:-reddit}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      PORT: "8085"
      DATABASE_URL: postgres://${POSTGRES_USER:-reddit}:${POSTGRES_PASSWORD:-reddit}@postgres:5432/${POSTGRES_DB:-reddit}?sslmode=disable
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8085/api/v1/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3005}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8085/api/v1}
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: "3005"
    depends_on:
      - api

volumes:
  pgdata:
